<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafeFileDrag — Gecko probe</title>
<style>
  body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 16px 20px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #status { font-weight: 600; }
  pre { background: rgba(127,127,127,.12); padding: 10px; border-radius: 8px; overflow: auto; }
  .ok::before { content: "PASS  "; color: #1a7f37; }
  .bad::before { content: "FAIL  "; color: #cf222e; }
  .detail { opacity: .75; }
</style>
<script>
  /*
   * Runs as early as a page script can run. The content script is injected at
   * `document_start` — before this — and in the page's own world (`world: "MAIN"`), so
   * both observations below are only possible if the injection really happened that way:
   * the install marker lives on the page's `window`, and a MAIN-world script gets no
   * WebExtension APIs.
   */
  window.__safeFileDragProbe = {
    markerAtDocumentStart: Boolean(window[Symbol.for('safe-file-drag/installed/v1')]),
    hasWebExtensionApis: typeof browser !== 'undefined' || typeof chrome !== 'undefined',
  };
</script>
</head>
<body>

<h1>SafeFileDrag — Gecko probe</h1>
<p id="status">running…</p>
<pre id="log"></pre>

<script>
(async function () {
  'use strict';

  var results = [];
  var evidence = {
    userAgent: navigator.userAgent,
    dragEventConstructor: typeof DragEvent,
    markerAtDocumentStart: window.__safeFileDragProbe.markerAtDocumentStart,
    hasWebExtensionApis: window.__safeFileDragProbe.hasWebExtensionApis,
  };

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  /** Firefox stack traces do not carry the message, so keep it in the detail. */
  function describeError(error) {
    var message = error && error.message ? String(error.message) : String(error);
    var stack = error && error.stack ? String(error.stack) : '';
    return stack ? message + '\n        ' + stack.replace(/\n/g, '\n        ') : message;
  }

  function check(name, fn) {
    try {
      var detail = fn();
      results.push({ name: name, ok: true, detail: detail == null ? null : String(detail) });
    } catch (error) {
      results.push({ name: name, ok: false, detail: describeError(error) });
    }
  }

  function nameOf(node) {
    if (node === window) return 'window';
    if (node === document) return 'document';
    if (!node) return String(node);
    if (node.nodeType === 11) return (node.host ? nameOf(node.host) : '(detached)') + '/shadow(' + node.mode + ')';
    if (node.nodeType === 1) return node.tagName.toLowerCase() + (node.id ? '#' + node.id : '');
    return 'nodeType=' + node.nodeType;
  }

  function el(tag, props) {
    var element = document.createElement(tag);
    if (props) Object.assign(element, props);
    document.body.append(element);
    return element;
  }

  /** A real `DataTransfer` carrying a real `File`, as a file drag would. */
  function fileTransfer(name) {
    var transfer = new DataTransfer();
    transfer.items.add(new File(['contents'], name || 'report.pdf', { type: 'application/pdf' }));
    return transfer;
  }

  function dragEventOn(type, target, transfer) {
    // `composed: true` matters: without it the event would not leave a shadow tree, and
    // a real drag event is composed.
    var event = new DragEvent(type, {
      bubbles: true,
      cancelable: true,
      composed: true,
      dataTransfer: transfer,
    });
    if (event.dataTransfer !== transfer) {
      Object.defineProperty(event, 'dataTransfer', { value: transfer, configurable: true });
      evidence.dragEventConstructorKeptDataTransfer = false;
    }
    target.dispatchEvent(event);
    return event;
  }

  function sequence(target, transfer) {
    return {
      enter: dragEventOn('dragenter', target, transfer),
      over: dragEventOn('dragover', target, transfer),
      drop: dragEventOn('drop', target, transfer),
    };
  }

  function phases(events) {
    return 'dragenter=' + events.enter.defaultPrevented
      + ' dragover=' + events.over.defaultPrevented
      + ' drop=' + events.drop.defaultPrevented;
  }

  // --- the injection itself ---------------------------------------------------

  check('content script is installed at document_start in the page world', function () {
    assert(window.__safeFileDragProbe.markerAtDocumentStart,
      'the install marker was not visible to a script in <head>, so the add-on did not run in the page world at document_start');
    return 'install marker already set before any other page script';
  });

  check('the page world has no WebExtension APIs', function () {
    assert(!window.__safeFileDragProbe.hasWebExtensionApis,
      'browser/chrome exists, so this is not the MAIN world');
    return 'typeof browser === "undefined" && typeof chrome === "undefined"';
  });

  // --- the real DataTransfer --------------------------------------------------

  check('a real DataTransfer with a file item reports the "Files" type', function () {
    var transfer = fileTransfer();
    evidence.dataTransferTypes = Array.from(transfer.types);
    evidence.dataTransferFiles = Array.from(transfer.files).map(function (file) { return file.name; });
    assert(evidence.dataTransferTypes.includes('Files'),
      'types was ' + JSON.stringify(evidence.dataTransferTypes));
    return JSON.stringify(evidence.dataTransferTypes);
  });

  // --- verdicts, with a real DragEvent and a real DataTransfer ----------------

  check('a file drop on a plain element is cancelled in all three phases', function () {
    var events = sequence(el('div', { id: 'plain' }), fileTransfer());
    assert(events.enter.defaultPrevented && events.over.defaultPrevented && events.drop.defaultPrevented,
      phases(events));
    return phases(events);
  });

  check('a file drop on <input type="file"> is left to the browser', function () {
    var events = sequence(el('input', { id: 'upload', type: 'file' }), fileTransfer());
    assert(!events.enter.defaultPrevented && !events.over.defaultPrevented && !events.drop.defaultPrevented,
      phases(events));
    return phases(events);
  });

  check('a file drop on a disabled file input is blocked', function () {
    var events = sequence(el('input', { id: 'disabled', type: 'file', disabled: true }), fileTransfer());
    assert(events.drop.defaultPrevented, phases(events));
    return phases(events);
  });

  // --- shadow DOM: retargeting as Gecko really does it -------------------------

  check('a file input inside an open shadow root is left to the browser', function () {
    var host = el('div', { id: 'component' });
    var root = host.attachShadow({ mode: 'open' });
    var input = document.createElement('input');
    input.type = 'file';
    input.id = 'shadow-input';
    root.append(input);

    var seenTarget = null;
    var seenPath = null;
    var watcher = function (event) {
      seenTarget = event.target;
      seenPath = event.composedPath();
    };
    window.addEventListener('drop', watcher);
    var events = sequence(input, fileTransfer());
    window.removeEventListener('drop', watcher);

    // What `event.target` and `composedPath()` look like from outside an open shadow root
    // is a browser question, not a jsdom one: the DOM specification only retargets
    // *closed* roots. Recorded as evidence either way, because the guard's native-target
    // check depends on it.
    evidence.openShadowTargetAtWindow = nameOf(seenTarget);
    evidence.openShadowPathAtWindow = (seenPath || []).map(nameOf);
    evidence.openShadowDropPrevented = events.drop.defaultPrevented;

    assert(seenPath && seenPath[0] === input,
      'composedPath()[0] at window was not the real file input: ' + JSON.stringify(evidence.openShadowPathAtWindow));
    assert(events.drop.defaultPrevented === false,
      'the guard cancelled a drop the browser would have handled: ' + phases(events));
    return 'target=' + evidence.openShadowTargetAtWindow
      + ', composedPath[0]=' + nameOf((seenPath || [])[0])
      + ', drop not prevented';
  });

  check('a file input inside a closed shadow root is blocked (fail-safe)', function () {
    var host = el('div', { id: 'closed-component' });
    var root = host.attachShadow({ mode: 'closed' });
    var input = document.createElement('input');
    input.type = 'file';
    input.id = 'closed-shadow-input';
    root.append(input);

    var seenTarget = null;
    var seenPath = null;
    var watcher = function (event) {
      seenTarget = event.target;
      seenPath = event.composedPath();
    };
    window.addEventListener('drop', watcher);
    var events = sequence(input, fileTransfer());
    window.removeEventListener('drop', watcher);

    evidence.closedShadowTargetAtWindow = nameOf(seenTarget);
    evidence.closedShadowPathAtWindow = (seenPath || []).map(nameOf);
    evidence.closedShadowDropPrevented = events.drop.defaultPrevented;

    assert(seenTarget === host, 'a closed root did not retarget event.target to the host');
    assert(events.drop.defaultPrevented, phases(events));
    return phases(events) + ' — the guard cannot see inside a closed root';
  });

  // --- drags that are none of the guard's business -----------------------------

  check('a text drag is not touched', function () {
    var transfer = new DataTransfer();
    transfer.setData('text/plain', 'hello');
    evidence.textDragTypes = Array.from(transfer.types);
    var event = dragEventOn('drop', el('div', { id: 'text-target' }), transfer);
    assert(!event.defaultPrevented, 'a text drag was cancelled');
    return 'not prevented, types=' + JSON.stringify(evidence.textDragTypes);
  });

  // --- the page's own handling ------------------------------------------------

  check('a dropzone that consumes the drop still receives the file', function () {
    var zone = el('div', { id: 'zone' });
    var received = null;
    zone.addEventListener('dragover', function (event) { event.preventDefault(); });
    zone.addEventListener('drop', function (event) {
      event.preventDefault();
      received = Array.from(event.dataTransfer.files).map(function (file) { return file.name; });
    });

    var events = sequence(zone, fileTransfer('zone.pdf'));
    assert(events.drop.defaultPrevented, 'the drop was not prevented');
    assert(received && received.length === 1 && received[0] === 'zone.pdf',
      'the page handler saw ' + JSON.stringify(received));

    // …and a plain element in the same page is still protected, i.e. the verdict is per
    // target and not per page.
    var after = dragEventOn('drop', el('div', { id: 'plain-again' }), fileTransfer());
    assert(after.defaultPrevented, 'a plain element was not blocked while a dropzone existed');
    return 'page handler received zone.pdf; a plain element in the same page is still blocked';
  });

  check('stopPropagation without preventDefault is still overruled', function () {
    var target = el('div', { id: 'stops-only' });
    target.addEventListener('drop', function (event) { event.stopPropagation(); });
    var event = dragEventOn('drop', target, fileTransfer());
    assert(event.defaultPrevented, 'the guard did not notice cancelBubble');
    return 'drop prevented even though propagation stopped at the target';
  });

  check('KNOWN HOLE: stopImmediatePropagation without preventDefault defeats the guard', function () {
    var target = el('div', { id: 'hostile' });
    target.addEventListener('drop', function (event) { event.stopImmediatePropagation(); });
    var event = dragEventOn('drop', target, fileTransfer());
    assert(event.defaultPrevented === false,
      'the guard won here after all, so the README limitation is out of date');
    return 'not prevented — the documented limitation reproduces in Gecko';
  });

  // --- report -----------------------------------------------------------------

  var passed = results.filter(function (result) { return result.ok; }).length;
  var summary = passed + '/' + results.length + ' checks passed';
  document.getElementById('status').textContent = summary;

  var log = document.getElementById('log');
  results.forEach(function (result) {
    var line = document.createElement('div');
    line.className = result.ok ? 'ok' : 'bad';
    line.textContent = result.name;
    if (result.detail) {
      var detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = '  — ' + result.detail;
      line.append(detail);
    }
    log.append(line);
  });

  try {
    await fetch('/__result', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        ok: passed === results.length,
        summary: summary,
        results: results,
        evidence: evidence,
        href: location.href,
      }),
    });
  } catch (error) {
    document.getElementById('status').textContent = summary + ' (could not report back)';
  }
})();
</script>
</body>
</html>
