     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg11"
     showgrid="false"
     showborder="false"
     borderlayer="false"
     inkscape:antialias-rendering="false"
     inkscape:clip-to-page="false" />
  <defs
     id="defs1">
    <!-- 定义圆角样式 -->
    <style
       id="style1">
      .shield-main { fill: #165a9c; stroke: #0f2d4a; stroke-width: 8; stroke-linejoin: round; }
      .shield-inner { fill: #1d6eb8; }
      .doc-white { fill: #ffffff; stroke: #0f2d4a; stroke-width: 6; stroke-linejoin: round; }
      .doc-line { stroke: #1d6eb8; stroke-width: 8; stroke-linecap: round; }
      .ban-circle { fill: none; stroke: #e84033; stroke-width: 16; }
      .ban-slash { stroke: #e84033; stroke-width: 16; stroke-linecap: round; }
      .dashed-arrow { fill: none; stroke: #218ff0; stroke-width: 8; stroke-dasharray: 12, 12; stroke-linecap: round; }
      .arrow-head { fill: #218ff0; }
      .check-mark { fill: none; stroke: #1fbb4e; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- 背景盾牌 -->
  <g
     id="shield">
    <!-- 盾牌外轮廓 -->
    <path
       class="shield-main"
       d="M 250 80 L 400 130 L 380 320 C 360 400 250 450 250 450 C 250 450 140 400 120 320 L 100 130 Z"
       id="path1" />
    <!-- 盾牌内层高光（增加一点立体感） -->
    <path
       class="shield-inner"
       d="M 250 100 L 380 145 L 360 315 C 340 380 250 425 250 425 C 250 425 160 380 140 315 L 120 145 Z"
       id="path2" />
    <!-- 中间折线 -->
    <path
       d="M 250 100 L 250 425"
       fill="none"
       stroke="#0f2d4a"
       stroke-width="8"
       opacity="0.3"
       id="path3" />
  </g>
  <!-- 盾牌内的文件 (已调整位置，使其更居中) -->
  <g
     id="internal-document">
    <!-- 文件主体与折角 -->
    <path
       class="doc-white"
       d="M 170 200 L 250 200 L 270 220 L 270 330 L 170 330 Z"
       id="path4" />
    <path
       d="M 250 200 L 250 220 L 270 220"
       class="doc-white"
       id="path5" />
    <!-- 文件内容线 -->
    <line
       x1="190"
       y1="245"
       x2="250"
       y2="245"
       class="doc-line"
       id="line5" />
    <line
       x1="190"
       y1="270"
       x2="250"
       y2="270"
       class="doc-line"
       id="line6" />
    <line
       x1="190"
       y1="295"
       x2="250"
       y2="295"
       class="doc-line"
       id="line7" />
  </g>
  <!-- 禁止符号（红色） -->
  <g
     id="no-symbol"
     transform="translate(4.3370508,-16.728625)">
    <circle
       cx="320"
       cy="200"
       r="50"
       class="ban-circle"
       id="circle7" />
    <line
       x1="285"
       y1="165"
       x2="355"
       y2="235"
       class="ban-slash"
       id="line8" />
  </g>
  <!-- 虚线箭头 (调整了起点，连接到右下角外部文件) -->
  <g
