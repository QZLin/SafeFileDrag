     style="stroke:#89fafe;stroke-opacity:1;fill:none;fill-opacity:1">
    <path
       d="M 255 310 Q 310 330 340 380"
       class="dashed-arrow"
       id="path8"
       style="stroke:#89fafe;stroke-opacity:1;fill:none;fill-opacity:1" />
    <!-- 箭头 -->
    <polygon
       points="350,390 325,385 335,365 "
       class="arrow-head"
       id="polygon8"
       transform="matrix(1.6302242,0.43295014,-0.31815181,1.1768471,-80.715782,-207.5502)"
       style="stroke:#00b400;stroke-opacity:1;fill:#89fafe;fill-opacity:1;stroke-width:3.48682454;stroke-dasharray:none" />
  </g>
  <!-- 右侧外部文件（带有打勾） -->
  <g
     id="external-document">
    <!-- 文件主体 -->
    <path
       class="doc-white"
       d="M 370 360 L 420 360 L 440 380 L 440 440 L 370 440 Z"
       id="path9" />
    <!-- 折角 -->
    <path
       d="M 420 360 L 420 380 L 440 380"
       class="doc-white"
       id="path10" />
    <!-- 绿色对勾 -->
    <path
       class="check-mark"
       d="M 385 400 L 395 410 L 420 385"
       id="path11" />
    <!-- 底部小横线 -->
    <line
       x1="405"
       y1="425"
       x2="425"
       y2="425"
       stroke="#0f2d4a"
       stroke-width="8"
       stroke-linecap="round"
       id="line11" />
  </g>
</svg>
